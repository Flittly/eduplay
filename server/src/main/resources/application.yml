spring:
  application:
    name: eduplay-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/eduplay_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/cloud
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:18080}

eduplay:
  plugins:
    package-dir: ${EDUPLAY_PLUGIN_PACKAGE_DIR:./plugins/packages}
    install-dir: ${EDUPLAY_PLUGIN_INSTALL_DIR:./plugins/installed}

logging:
  level:
    org.hibernate.SQL: info
