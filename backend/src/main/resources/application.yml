spring:
  profiles:
    default: local
  application:
    name: eduplay-backend
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 生产态把 SQL 打到 info 级、并且每条再 format 一遍多行，
        # 日志体积会翻好几倍（开着 format_sql 时一条 INSERT 占 8~10 行）。
        # 需要看 SQL 时用 EDUPLAY_SQL_LOG=debug 临时打开即可。
        format_sql: ${EDUPLAY_SQL_FORMAT:false}
  servlet:
    multipart:
      # 实测最大的游戏包已经 7.09 MB，原先 10 MB 只余 2.9 MB；
      # 一个带 three.js 与贴图的新包轻松超 20 MB，此时上传会直接失败。
      max-file-size: ${EDUPLAY_MAX_UPLOAD:100MB}
      max-request-size: ${EDUPLAY_MAX_UPLOAD:100MB}
  web:
    resources:
      cache:
        cachecontrol:
          # 入口 index.html 的文件名是固定的，一旦被浏览器/Electron 缓存，
          # 用户升级到新版本后仍会看到旧界面（名字、版本号都是旧的）。
          # 所以静态资源默认一律「回源校验」，由 Last-Modified 决定是否 304；
          # 带内容 hash 的 /assets/** 例外，由 StaticResourceCacheConfig 给长缓存。
          no-cache: true

server:
  port: 7070
  # ⚠ 只监听回环地址。不写这一行时 Tomcat 默认绑 0.0.0.0：
  # 同一个局域网（学校的教室网络）里任何一台机器都能打开 http://老师机IP:7070，
  # 进而触达管理端。本平台是纯本机应用，没有任何"家里另一台设备要访问"的场景；
  # 确实需要跨机访问时用 EDUPLAY_BIND_ADDRESS=0.0.0.0 显式打开。
  address: ${EDUPLAY_BIND_ADDRESS:127.0.0.1}

eduplay:
  version: @project.version@
  plugins:
    package-dir: ${EDUPLAY_PLUGIN_PACKAGE_DIR:./plugins/packages}
    install-dir: ${EDUPLAY_PLUGIN_INSTALL_DIR:./plugins/installed}

logging:
  level:
    org.hibernate.SQL: ${EDUPLAY_SQL_LOG:warn}
