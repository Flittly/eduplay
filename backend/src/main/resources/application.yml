spring:
  application:
    name: eduplay-backend
  datasource:
    url: jdbc:h2:file:./data/eduplay;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

eduplay:
  plugins:
    package-dir: ${EDUPLAY_PLUGIN_PACKAGE_DIR:./plugins/packages}
    install-dir: ${EDUPLAY_PLUGIN_INSTALL_DIR:./plugins/installed}

logging:
  level:
    org.hibernate.SQL: info
