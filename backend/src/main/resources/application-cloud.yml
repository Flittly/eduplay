spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/eduplay_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/cloud

eduplay:
  plugins:
    package-dir: ${EDUPLAY_PLUGIN_PACKAGE_DIR:./plugins/packages}
    install-dir: ${EDUPLAY_PLUGIN_INSTALL_DIR:./plugins/installed}
